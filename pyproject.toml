[project]
name = "adaptix-testing"
version = "2.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "paramiko>=4.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "rich>=14.2.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
