[project]
name = "adaptix-testing"
version = "2.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "paramiko>=4.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "rich>=14.2.0",
    "uvicorn>=0.32",
]

[project.scripts]
adaptix-testing = "adaptix_testing.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adaptix_testing"]

[dependency-groups]
dev = ["pytest>=9.0", "anyio>=4.0"]
