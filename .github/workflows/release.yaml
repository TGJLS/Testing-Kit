name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add version tag to Docker image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          docker pull ghcr.io/tgjls/testing-kit:latest
          docker tag ghcr.io/tgjls/testing-kit:latest ghcr.io/tgjls/testing-kit:${VERSION}
          docker push ghcr.io/tgjls/testing-kit:${VERSION}

      - name: Build CLI
        run: |
          cd cli && go build \
            -ldflags "-X main.version=${GITHUB_REF_NAME} -X 'main.repoOwner=TGJLS/Testing-Kit'" \
            -o ../testing-kit-cli \
            .

      - name: Package CLI
        run: tar -czf testing-kit-cli.tar.gz testing-kit-cli

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          RANGE="${PREV_TAG:+${PREV_TAG}..}HEAD"

          get_commits() { git log $RANGE --format="%s" | grep -E "^$1(\([^)]*\))?!?:" | sed "s/^$1[^:]*: /- /" || true; }

          FEATURES=$(get_commits "feat")
          FIXES=$(get_commits "fix")
          DOCS=$(get_commits "docs")
          REFACTORS=$(get_commits "refactor")
          CHORES=$(git log $RANGE --format="%s" | grep -E "^(chore|ci|test|build|perf)(\([^)]*\))?!?:" | sed 's/^[^:]*: /- /' || true)

          {
            [ -n "$FEATURES" ]  && printf "## Features\n%s\n\n"     "$FEATURES"
            [ -n "$FIXES" ]     && printf "## Bug Fixes\n%s\n\n"    "$FIXES"
            [ -n "$DOCS" ]      && printf "## Documentation\n%s\n\n" "$DOCS"
            [ -n "$REFACTORS" ] && printf "## Refactoring\n%s\n\n"  "$REFACTORS"
            [ -n "$CHORES" ]    && printf "## Maintenance\n%s\n\n"   "$CHORES"
          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub release
        run: gh release create ${{ github.ref_name }} --notes-file release-notes.md testing-kit-cli.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
