name: Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run unit tests
        run: uv run pytest adaptix_testing/tests/ -v

  integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Docker image
        run: docker build -t ghcr.io/tgjls/testing-kit:2.0.0 .

      - name: Build CLI
        run: |
          cd cli && go build \
            -ldflags "-X main.version=${GITHUB_SHA} -X 'main.repoOwner=TGJLS/Testing-Kit'" \
            -o ../testing-kit-cli \
            .

      - name: Package CLI
        run: tar -czf testing-kit-cli.tar.gz testing-kit-cli

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Simulate install
        run: |
          tar -xvzf testing-kit-cli.tar.gz
          ./testing-kit-cli install

      - name: Wait for testing-kit API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:1234/health > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "testing-kit API did not become ready in time"
          exit 1

      - name: Run tests
        run: ./testing-kit-cli run-tests

      - name: Print testing-kit logs
        if: always()
        run: docker compose logs testing-kit

      - name: Teardown
        if: always()
        run: ./testing-kit-cli reset
