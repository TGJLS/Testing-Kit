name: Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run unit tests
        run: uv run pytest adaptix_testing/tests/ -v

  integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Docker image
        run: docker build -t ghcr.io/tgjls/testing-kit:2.1.0 .

      - name: Build CLI
        run: |
          cd cli && go build \
            -ldflags "-X main.version=${GITHUB_SHA} -X 'main.repoOwner=TGJLS/Testing-Kit'" \
            -o ../testing-kit-cli \
            .

      - name: Package CLI
        run: tar -czf testing-kit-cli.tar.gz testing-kit-cli

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            if sudo apt-get install -y -qq cpu-checker 2>/dev/null && kvm-ok 2>&1 | grep -q "KVM acceleration can be used"; then
              echo "✓ KVM hardware acceleration confirmed"
            else
              echo "⚠ /dev/kvm present but hardware acceleration unavailable — Windows boot may exceed timeout"
            fi
          else
            echo "⚠ /dev/kvm not found — running without KVM"
          fi

      - name: Simulate install
        run: |
          tar -xvzf testing-kit-cli.tar.gz
          ./testing-kit-cli install

      - name: Wait for testing-kit API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:1234/health > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "testing-kit API did not become ready in time"
          exit 1

      - name: Wait for adaptixc2
        run: |
          for i in $(seq 1 90); do
            docker compose exec testing-kit python3 -c \
              "import socket,sys; socket.create_connection(('adaptixc2',4321),2).close()" \
              2>/dev/null && { echo '✓ adaptixc2 ready'; exit 0; }
            sleep 2
          done
          docker compose logs adaptixc2
          echo 'adaptixc2 did not become ready in time'
          exit 1

      - name: Run tests
        run: ./testing-kit-cli run-tests

      - name: Print testing-kit logs
        if: always()
        run: docker compose logs testing-kit

      - name: Print adaptixc2 logs
        if: always()
        run: docker compose logs adaptixc2

      - name: Teardown
        if: always()
        run: ./testing-kit-cli reset

  test-kharon:
    name: Test Kharon extender
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build CLI
        run: |
          cd cli && go build \
            -ldflags "-X main.version=${GITHUB_SHA} -X 'main.repoOwner=TGJLS/Testing-Kit'" \
            -o ../testing-kit-cli \
            .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Docker image
        run: docker build -t ghcr.io/tgjls/testing-kit:2.1.0 .

      - name: Install stack
        run: ./testing-kit-cli install

      - name: Wait for testing-kit API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:1234/health > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "testing-kit API did not become ready in time"
          exit 1

      - name: Add Kharon extender
        run: |
          PROFILE_B64=$(base64 -w0 .github/cicd/kharon-malleable-profile.json)
          ./testing-kit-cli add-extender \
            --install-script .github/cicd/install-kharon.sh \
            --override "listener.port_bind=8080" \
            --override "listener.block_user_agents=" \
            --override "listener.domain_rotation_strategy=Random" \
            --override "listener.proxy_url=" \
            --override "listener.proxy_user=" \
            --override "listener.proxy_pass=" \
            --override "listener.ssl_cert=" \
            --override "listener.ssl_key=" \
            --override "listener.uploaded_file=${PROFILE_B64}" \
            https://github.com/entropy-z/Kharon

      - name: Seed Kharon tasks
        run: |
          curl -sf -X PUT http://localhost:1234/v1/tasks/batch \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "
          import json, yaml
          data = yaml.safe_load(open('.github/cicd/kharon-tasks.yaml'))
          print(json.dumps(data['tasks']))
          ")"

      - name: Wait for Windows SSH
        run: |
          for i in $(seq 1 150); do
            docker compose exec testing-kit python3 -c \
              "import socket,sys; socket.create_connection(('windows',22),5).close()" \
              2>/dev/null && { echo "✓ Windows SSH ready (attempt $i)"; exit 0; }
            echo "Waiting for Windows SSH (attempt $i/150)..."
            sleep 20
          done
          docker compose logs windows | tail -50
          echo "Windows SSH not ready after 50 minutes"
          exit 1

      - name: Run tests
        run: ./testing-kit-cli run-tests

      - name: Print adaptixc2 logs
        if: always()
        run: docker compose logs adaptixc2 | tail -100 || true

      - name: Tear down
        if: always()
        run: ./testing-kit-cli down

  test-extension-kit:
    name: Test Extension-Kit BOFs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build CLI
        run: |
          cd cli && go build \
            -ldflags "-X main.version=${GITHUB_SHA} -X 'main.repoOwner=TGJLS/Testing-Kit'" \
            -o ../testing-kit-cli \
            .

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Docker image
        run: docker build -t ghcr.io/tgjls/testing-kit:2.1.0 .

      - name: Install stack
        run: ./testing-kit-cli install

      - name: Wait for testing-kit API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:1234/health > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "testing-kit API did not become ready in time"
          exit 1

      - name: Add Extension-Kit BOFs
        run: |
          ./testing-kit-cli add-extender \
            --install-script .github/cicd/install-extension-kit.sh \
            --no-restart \
            https://github.com/Adaptix-Framework/Extension-Kit

      - name: Seed Extension-Kit tasks
        run: |
          curl -sf -X PUT http://localhost:1234/v1/tasks/batch \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "
          import json, yaml
          data = yaml.safe_load(open('.github/cicd/extension-kit-tasks.yaml'))
          print(json.dumps(data['tasks']))
          ")"

      - name: Wait for Windows SSH
        run: |
          for i in $(seq 1 150); do
            docker compose exec testing-kit python3 -c \
              "import socket,sys; socket.create_connection(('windows',22),5).close()" \
              2>/dev/null && { echo "✓ Windows SSH ready (attempt $i)"; exit 0; }
            echo "Waiting for Windows SSH (attempt $i/150)..."
            sleep 20
          done
          docker compose logs windows | tail -50
          echo "Windows SSH not ready after 50 minutes"
          exit 1

      - name: Run tests
        run: ./testing-kit-cli run-tests

      - name: Tear down
        if: always()
        run: ./testing-kit-cli down
