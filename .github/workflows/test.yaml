name: Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup (KVM check + SSH keygen + render configs)
        run: bash setup.sh init

      - name: Start infra
        run: bash setup.sh up

      - name: Run tests
        run: bash setup.sh test

      - name: Print AdaptixC2 logs
        if: always()
        run: docker compose logs adaptixc2

      - name: Teardown
        if: always()
        run: bash setup.sh down
