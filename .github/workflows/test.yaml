name: Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Docker image
        run: docker build -t ghcr.io/tgjls/testing-kit:2.0.0 .

      - name: Build CLI
        run: |
          go build \
            -ldflags "-X main.version=${GITHUB_SHA} -X 'main.repoOwner=TheGr3atJosh/Testing-Kit'" \
            -o testing-kit-cli \
            ./cli

      - name: Package CLI
        run: tar -czf testing-kit-cli.tar.gz testing-kit-cli

      - name: Simulate install
        run: |
          tar -xvzf testing-kit-cli.tar.gz
          ./testing-kit-cli install

      - name: Run tests
        run: ./testing-kit-cli run-tests

      - name: Print AdaptixC2 logs
        if: always()
        run: docker compose logs adaptixc2

      - name: Teardown
        if: always()
        run: ./testing-kit-cli reset
