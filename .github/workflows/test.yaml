name: Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/tgjls/testing-kit:2.0.0 .

      - name: Build CLI
        run: |
          cd cli && go build \
            -ldflags "-X main.version=${GITHUB_SHA} -X 'main.repoOwner=TGJLS/Testing-Kit'" \
            -o ../testing-kit-cli \
            .

      - name: Package CLI
        run: tar -czf testing-kit-cli.tar.gz testing-kit-cli

      - name: Simulate install
        run: |
          tar -xvzf testing-kit-cli.tar.gz
          ./testing-kit-cli install

      - name: Wait for testing-kit API
        run: |
          echo "Waiting for testing-kit API on :1234..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:1234/health > /dev/null 2>&1; then
              echo "API ready"
              exit 0
            fi
            echo "  attempt $i/30, retrying in 2s..."
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose logs testing-kit
          exit 1

      - name: Run tests
        run: ./testing-kit-cli run-tests

      - name: Print AdaptixC2 logs
        if: always()
        run: docker compose logs adaptixc2

      - name: Print testing-kit logs
        if: always()
        run: docker compose logs testing-kit

      - name: Teardown
        if: always()
        run: ./testing-kit-cli reset
